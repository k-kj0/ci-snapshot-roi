name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Dogfooding idea: after installing WarpBuild on this repo, use the app's
    # /m/<owner>/<repo> page to generate the runs-on change for this file.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
